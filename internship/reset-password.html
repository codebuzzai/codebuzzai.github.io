<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password · CodeBuzz AI Internship Program</title>
  <meta name="robots" content="noindex" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#0D1117" />
  <link rel="icon" type="image/png" href="../assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/internship.css" />
</head>
<body>
  <div class="fx" aria-hidden="true"><div class="grid-bg"></div><div class="orb o1"></div><div class="orb o2"></div></div>
  <nav class="nav">
    <div class="container nav-inner">
      <a href="../" class="logo" aria-label="CodeBuzz.ai home"><div class="logo-badge">CB</div><span>CodeBuzz<span class="accent">.ai</span></span></a>
      <a href="login.html" class="btn btn-ghost btn-sm">Student login</a>
    </div>
  </nav>

  <main class="auth-wrap">
    <div class="auth-card">
      <span class="eyebrow">Student portal</span>
      <h1 id="title">Choose a new password</h1>
      <p class="sub">At least 8 characters, with a letter and a number.</p>
      <form id="f-reset" novalidate>
        <div class="field">
          <label for="pw">New password</label>
          <div class="pw-wrap"><input class="ctrl" id="pw" type="password" autocomplete="new-password" maxlength="72" /><button class="pw-toggle" type="button">Show</button></div>
        </div>
        <div class="field">
          <label for="pw2">Confirm password</label>
          <div class="pw-wrap"><input class="ctrl" id="pw2" type="password" autocomplete="new-password" maxlength="72" /><button class="pw-toggle" type="button">Show</button></div>
        </div>
        <button class="btn btn-primary" type="submit">Save password &amp; log in</button>
      </form>
      <div class="msg" id="m" role="alert"></div>
      <div class="auth-links"><a href="login.html">&larr; Back to login</a></div>
    </div>
  </main>

  <script src="../assets/js/site-protect.js"></script>
  <script src="assets/config.js"></script>
  <script src="assets/common.js"></script>
  <script src="assets/portal.js"></script>
  <script>
  (function () {
    var P = window.Portal, $ = function (x) { return document.getElementById(x); };
    var qs = new URLSearchParams(location.search);
    var token = qs.get('token') || '', isSetup = qs.get('setup') === '1';
    if (isSetup) {
      $('title').textContent = 'Set up your password';
      document.title = 'Set up your password · CodeBuzz AI Internship';
      document.querySelector('#f-reset button[type=submit]').textContent = 'Save password & open my portal';
    }
    // Remove the token from the address bar so it isn't left in history or shared by accident
    if (token && history.replaceState) history.replaceState(null, '', location.pathname);
    P.wirePasswordToggles();
    if (!token) {
      $('f-reset').hidden = true;
      P.msg($('m'), 'This link is incomplete. Request a new one from the login page.');
      return;
    }
    $('f-reset').addEventListener('submit', function (e) {
      e.preventDefault();
      var btn = this.querySelector('button[type=submit]'), pw = $('pw').value, pw2 = $('pw2').value;
      if (!P.PW_RULE.test(pw)) return P.msg($('m'), 'Password must be 8–72 characters with at least one letter and one number.');
      if (pw !== pw2) return P.msg($('m'), 'Passwords don’t match.');
      P.busy(btn, true, 'Saving…');
      P.api('/auth/reset-password', { body: { token: token, password: pw, confirmPassword: pw2 } }).then(function (r) {
        P.busy(btn, false);
        if (!r.ok) return P.msg($('m'), r.data.message || 'Could not reset the password.');
        P.store('student', r.data.token);
        P.msg($('m'), (isSetup ? 'Password saved.' : 'Password updated.') + ' Taking you to your portal…', 'ok');
        setTimeout(function () { location.replace('dashboard.html'); }, 900);
      });
    });
  })();
  </script>
</body>
</html>
